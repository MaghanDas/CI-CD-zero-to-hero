
name: CI Pipeline

# ---- TRIGGERS______
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual trigger from github ui.               

#__________________ GLOBAL ENV VARS __________   
env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io 
  IMAGE_NAME: ${github.repository}}

#__________ JOBS __________ 
jobs:
  # ____ JOB 1: ___  
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    # step1: checkout the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4
    # step2: set up node
      - name: Set Up Node.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION}}
          cache: 'npm'
      # step3: install dependencies
      - name: Install dependencies
        run: npm ci
      # step4: runs linter
      - name: Lint
        run: npm run lint
      # step5: run tests with coverage
      - name: Run tests
        run: npm test -- --coverage

      # step: 6 ; upload coverage report as an artifact
      - name: Upload Coverage report.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7 # autodelete after 7 days
        
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # audit npm packages for known vulnerabilities
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # job 3: Build DOcker images
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test,security] # only runs if both jobs have succeed

    # only push imags on main-branch
    if: github.ref == 'ref/heads/main'

    # Permissions needed to push to GitHub Container Registry.
    permissions: 
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # log in to Github Container Registry using auto-generated token
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}} # auto-available, no set up needed

      # extract metadata- automatically generates tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY}}/${{ env.IMAGE_NAME}}
          tags: |
            type=sha,prefix=sha- 
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: . 
          push: true
          tags: ${{ steps.meta.outputs.tags}}
          labels: ${{ steps.meta.outputs.labels}}
          cache-from: type=gha # use github actions cache for docker layers
          cache-to: type=gha,mode=max # save layers to cache after build
          







  
  
